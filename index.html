<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Global Citizen Hub - Universal Smart Traveling and Relocation Toolkit with interactive tabs and live comprehensive conversion tools.">
    <title>Global Citizen Hub | Advanced Intelligence Core</title>
    <style>
        :root { --primary: #2980b9; --dark: #2c3e50; --light: #f4f6f7; --border: #d5dbdb; --success: #27ae60; --error: #c0392b; --accent: #d35400; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 950px; margin: 0 auto; padding: 20px; background-color: var(--light); color: #333; line-height: 1.6; }
        
        /* Global Navigation */
        .top-nav { display: flex; justify-content: center; gap: 20px; padding: 15px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .top-nav a, .site-footer a { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 0.95em; transition: opacity 0.2s; }
        .top-nav a:hover, .site-footer a:hover { opacity: 0.7; text-decoration: underline; }

        .card { background: #ffffff; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-top: 6px solid var(--primary); margin-bottom: 30px; }
        
        h1, h2, h3, h4 { color: var(--dark); margin-top: 0; }
        p { margin-bottom: 20px; font-size: 1.02em; }
        
        .selector-box { background: #fafbfc; border: 1px solid var(--border); border-radius: 6px; padding: 25px; margin-top: 25px; margin-bottom: 30px; }
        .destination-card { background: #ffffff; border: 1px solid var(--border); border-radius: 6px; padding: 20px; margin-bottom: 20px; transition: all 0.3s ease; }
        .destination-card h3 { margin-top: 0; color: var(--primary); font-size: 1.1em; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        
        /* Top Mode Tabs (Single vs Multi) */
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; font-weight: bold; font-size: 1em; background: none; border: 2px solid transparent; border-radius: 6px 6px 0 0; color: #7f8c8d; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { color: var(--dark); background: #ebf5fb; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #ffffff; }
        
        .form-grid-3 { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr; gap: 15px; margin-bottom: 15px; }
        .form-grid-parameters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; font-size: 0.85em; color: var(--dark); margin-bottom: 5px; }
        input, select { padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.95em; }
        
        .verification-badge { font-size: 0.85em; margin-top: 6px; font-weight: 600; }
        .verified { color: var(--success); }
        .unverified { color: var(--error); }

        .generate-container { text-align: right; margin-top: 20px; border-top: 1px dashed var(--border); padding-top: 20px; }
        .btn-generate { background: var(--primary); color: white; padding: 12px 30px; font-size: 1.05em; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .btn-generate:hover { opacity: 0.9; }
        .btn-generate:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-unlock-mode { background: var(--success); }

        /* Report Container & The 6 Pillar Tabs */
        #reportContainer { display: none; border-top: 6px solid var(--success); padding-top: 25px; }
        .report-header { background: #e8f8f5; border-left: 4px solid var(--success); padding: 15px 20px; margin-bottom: 25px; border-radius: 0 6px 6px 0; }
        
        .pillar-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; background: #ecf0f1; padding: 5px; border-radius: 6px; position: sticky; top: 10px; z-index: 10; }
        .pillar-tab-btn { flex: 1; min-width: 120px; padding: 10px; font-size: 0.9em; font-weight: bold; border: none; background: transparent; border-radius: 4px; color: var(--dark); cursor: pointer; transition: background 0.2s; }
        .pillar-tab-btn:hover { background: #bdc3c7; }
        .pillar-tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .pillar-content { display: none; background: #fafbfc; border: 1px solid var(--border); border-radius: 6px; padding: 25px; min-height: 200px; }
        .pillar-content.active { display: block; animation: fadeIn 0.3s ease; }
        
        /* List & Comparison Matrix Styles */
        .report-list ul { padding-left: 20px; font-size: 1.05em; line-height: 1.8; margin-top:0; }
        .report-list li { margin-bottom: 12px; }
        .comparison-metric { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding: 10px 0; font-size: 1.05em; }
        .comparison-metric span { width: 48%; }

        /* Comprehensive Live Conversion Tool Styles */
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 15px; }
        .tool-box { background: white; padding: 15px; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .tool-box h5 { margin: 0 0 12px 0; color: var(--primary); font-size: 1.05em; border-bottom: 1px solid var(--light); padding-bottom: 8px; }
        .tool-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 500; }
        .tool-row input { width: 85px; text-align: center; font-weight: bold; padding: 8px; border: 1px solid var(--border); border-radius: 4px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .site-footer { text-align: center; margin-top: 40px; border-top: 1px solid var(--light); padding-top: 20px; font-size: 0.9em; }
        .affiliate-note { font-size: 0.8em; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
