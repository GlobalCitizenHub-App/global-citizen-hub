<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Global Citizen Hub is the ultimate Smart Traveling and Relocation Toolkit.">
    <title>Global Citizen Hub | Smart Traveling and Relocation Toolkit</title>
    <style>
        :root { --primary: #2980b9; --success: #27ae60; --dark: #2c3e50; --light: #f4f6f7; --border: #d5dbdb; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background-color: var(--light); color: #333; line-height: 1.6; }
        h1, h2, h3 { color: var(--dark); margin-top: 0; }
        .card { background: #ffffff; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 20px; border-top: 6px solid var(--primary); }
        .article-header { border-bottom: 2px solid var(--light); padding-bottom: 15px; margin-bottom: 25px; }
        
        /* Persistent Paper Binder Navigation Tabs */
        .binder-nav { display: flex; flex-wrap: wrap; gap: 4px; background: #e5e8e8; padding: 8px 8px 0 8px; border-radius: 8px 8px 0 0; border-bottom: 3px solid #bdc3c7; margin-bottom: 25px; }
        .binder-tab { flex: 1; min-width: 95px; padding: 10px 6px; text-align: center; text-decoration: none; font-weight: bold; font-size: 0.78em; color: white; border-radius: 6px 6px 0 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); transition: transform 0.1s, opacity 0.2s; opacity: 0.8; }
        .binder-tab:hover { opacity: 1; transform: translateY(-2px); }
        .binder-tab.active { opacity: 1; box-shadow: inset 0 -5px 0 #fff, 0 -2px 5px rgba(0,0,0,0.2); filter: brightness(1.1); }
        
        .tab-master { background: #34495e; } .tab-p1 { background: #2980b9; } .tab-p2 { background: #27ae60; }
        .tab-p3 { background: #8e44ad; } .tab-p4 { background: #d35400; } .tab-p5 { background: #c0392b; } .tab-p6 { background: #16a085; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9em; color: var(--dark); }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 15px; background: #fff; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 5px rgba(41, 128, 185, 0.2); }
        button { background-color: var(--success); color: white; border: none; padding: 16px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background-color 0.2s; }
        button:hover { background-color: #1e8449; }
        .hidden { display: none; }
        #detectedZone { font-size: 14px; margin-top: 8px; margin-bottom: 15px; padding: 12px; background: #eaf2f8; border-left: 4px solid var(--primary); border-radius: 4px; }
        .gentle-notice { background-color: #fcf3cf; color: #7d6608; padding: 12px; border-radius: 6px; font-size: 0.9em; margin-bottom: 20px; border-left: 4px solid #f39c12; display: none; }
        .affiliate-disclosure { font-size: 0.75em; color: #95a5a6; text-align: center; margin-top: 35px; border-top: 1px solid var(--light); padding-top: 15px; }
    </style>
</head>
<body>
    <main class="card">
        <nav class="binder-nav" id="binderNav">
            <a href="index.html" class="binder-tab tab-master active">⌂ Dashboard</a>
            <a href="pillar-1/index.html" class="binder-tab tab-p1">1. Climate</a>
            <a href="pillar-2/index.html" class="binder-tab tab-p2">2. Cost</a>
            <a href="pillar-3/index.html" class="binder-tab tab-p3">3. Connectivity</a>
            <a href="pillar-4/index.html" class="binder-tab tab-p4">4. Transit</a>
            <a href="pillar-5/index.html" class="binder-tab tab-p5">5. Culture</a>
            <a href="pillar-6/index.html" class="binder-tab tab-p6">6. Shop & Convert</a>
        </nav>

        <header class="article-header">
            <h1>Global Citizen Hub: Master Dashboard</h1>
            <p><strong>The Smart Traveling and Relocation Toolkit.</strong> Enter your destination parameters once below to instantly unlock all 6 intelligence matrices.</p>
        </header>

        <section class="input-grid">
            <div class="full-width">
                <label for="cityInput">Destination (City, e.g., Rome, Milan, New York, Oslo):</label>
                <input type="text" id="cityInput" placeholder="Enter destination city...">
                <div id="detectedZone" class="hidden"></div>
            </div>
            <div>
                <label for="travelMonth">Travel Month:</label>
                <select id="travelMonth">
                    <option value="">Select Month</option>
                    <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                    <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                    <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                    <option value="10">October</option><option value="11">November</option><option value="12">December</option>
                </select>
            </div>
            <div>
                <label for="termDuration">Engagement Duration:</label>
                <select id="termDuration">
                    <option value="">Select Term</option>
                    <option value="Short-Term Visit (1-2 Weeks)">Short-Term Visit (1–2 Weeks)</option>
                    <option value="Medium-Term Stay (1-3 Months)">Medium-Term Stay (1–3 Months)</option>
                    <option value="Long-Term / Semester (4-6 Months)">Long-Term / Semester (4–6 Months)</option>
                    <option value="Annual / Multi-Year">Annual / Multi-Year Relocation</option>
                </select>
            </div>
            <div class="full-width">
                <label for="budgetProfile">Sustenance Profile (Excludes Accommodation):</label>
                <select id="budgetProfile">
                    <option value="">Select Operational Profile</option>
                    <option value="economical">Economical (Grocery-heavy, street food, public transit)</option>
                    <option value="moderate">Moderate (Balanced dining, cafes, occasional taxi)</option>
                    <option value="elevated">Elevated (Frequent sit-down dining, premium transit)</option>
                </select>
            </div>
        </section>

        <button id="calculateBtn">Save Parameters & Hydrate Intelligence Hubs</button>
    </main>

    <script>
        (function() {
            const globalLocationMap = {
                "rome": { country: "Italy" }, "milan": { country: "Italy" }, "oslo": { country: "Norway" },
                "new york": { country: "United States" }, "paris": { country: "France" }, "london": { country: "United Kingdom" }
            };

            const cityInput = document.getElementById('cityInput');
            const travelMonth = document.getElementById('travelMonth');
            const termDuration = document.getElementById('termDuration');
            const budgetProfile = document.getElementById('budgetProfile');

            // Load saved parameters from localStorage if available
            if (!window.location.search && localStorage.getItem('gch_city')) {
                cityInput.value = localStorage.getItem('gch_city');
                travelMonth.value = localStorage.getItem('gch_month') || "";
                termDuration.value = localStorage.getItem('gch_term') || "";
                budgetProfile.value = localStorage.getItem('gch_profile') || "";
            }

            document.getElementById('calculateBtn').addEventListener('click', function() {
                const rawInput = cityInput.value.trim();
                const cleanCityKey = rawInput.split(',')[0].trim().toLowerCase();
                const monthVal = travelMonth.value;
                const termVal = termDuration.value;
                const profileVal = budgetProfile.value;

                if (!rawInput || !monthVal || !termVal || !profileVal) { alert('Please complete all 4 parameter fields.'); return; }
                
                const formalCity = cleanCityKey.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                let country = globalLocationMap[cleanCityKey] ? globalLocationMap[cleanCityKey].country : "International";

                // Save to localStorage for persistent memory
                localStorage.setItem('gch_city', formalCity);
                localStorage.setItem('gch_country', country);
                localStorage.setItem('gch_month', monthVal);
                localStorage.setItem('gch_term', termVal);
                localStorage.setItem('gch_profile', profileVal);

                const newQs = `?city=${encodeURIComponent(formalCity)}&country=${encodeURIComponent(country)}&month=${monthVal}&term=${encodeURIComponent(termVal)}&profile=${profileVal}`;
                window.location.href = `pillar-1/index.html${newQs}`;
            });
        })();
    </script>
</body>
</html>
