<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Travel & Climate Intelligence Platform - Pillar 1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .article-header {
            border-bottom: 2px solid #2980b9;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #1f618d;
        }
        .hidden {
            display: none;
        }
        #results {
            background: #eaf2f8;
            border-left: 5px solid #2980b9;
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 4px;
        }
        #detectedZone {
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="article-header">
            <h3>Pillar 1 | Article 1: Location Resolution & Layering Engine</h3>
            <p><em>Holistic Travel Intelligence Framework: Real-time destination parsing, capital routing, wardrobe matrix adaptation, and seasonal environmental matching.</em></p>
        </div>

        <label for="cityInput">Destination (City, e.g., New York, Dubai, Mexico City, Paris, Seoul, Sydney):</label>
        <input type="text" id="cityInput" placeholder="Enter destination...">
        <div id="detectedZone"></div>

        <label for="travelMonth">Travel Month:</label>
        <select id="travelMonth">
            <option value="">Select Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>

        <label for="termDuration">Engagement Term / Duration:</label>
        <select id="termDuration">
            <option value="">Select Term Duration</option>
            <option value="Short-Term Visit (1-2 Weeks)">Short-Term Visit (1–2 Weeks)</option>
            <option value="Medium-Term Stay (1-3 Months)">Medium-Term Stay (1–3 Months)</option>
            <option value="Long-Term / Semester (4-6 Months)">Long-Term / Semester (4–6 Months)</option>
            <option value="Annual / Multi-Year Relocation">Annual / Multi-Year Relocation</option>
        </select>

        <button id="calculateBtn">Generate Precision Matrix</button>

        <div id="results" class="hidden">
            <h3>Matrix Output</h3>
            <div id="outputContent"></div>
        </div>
    </div>

    <script src="global-standards.js"></script>
    <script src="converter.js"></script>
</body>
</html>
