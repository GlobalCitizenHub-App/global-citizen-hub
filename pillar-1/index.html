<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Travel & Climate Intelligence Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #1f618d;
        }
        .hidden {
            display: none;
        }
        #results {
            background: #eaf2f8;
            border-left: 5px solid #2980b9;
            padding: 15px 20px;
            margin-top: 20px;
            border-radius: 4px;
        }
        #detectedZone {
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pillar 1: Interactive Climate & Layering Engine</h1>
        <p>Enter your travel destination and timeframe to generate a precision seasonal matrix backed by global conversion standards.</p>
        
        <label for="cityInput">Destination (City or Country):</label>
        <input type="text" id="cityInput" placeholder="e.g., Tokyo, Seoul, Japan, Mexico">
        <div id="detectedZone"></div>

        <label for="travelMonth">Travel Month:</label>
        <select id="travelMonth">
            <option value="">Select Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>

        <label for="duration">Duration (Days):</label>
        <input type="number" id="duration" placeholder="e.g., 7" min="1" max="365">

        <button id="calculateBtn">Generate Precision Matrix</button>

        <div id="results" class="hidden">
            <h3>Matrix Output</h3>
            <div id="outputContent"></div>
        </div>
    </div>

    <script src="global-standards.js"></script>
    <script src="pillar-1/converter.js"></script>
</body>
</html>
